# Per-task budgets for Stage 1 inference (HARNESS_README section 7.1).
# About 120 hidden tasks share a 12-hour total. Runs of 13 and 18 hours were
# still scored, so the working hypothesis is that the 12 hours count agent time
# only: 120 tasks at 6 minutes is exactly 12 hours (PLAN.md, time budget).
# WARNING: going above 6 bets that the limit is not enforced at all.
# WARNING: the time cap is checked between events, so one long LLM call or
# command can overrun it. Keep max_output_tokens and timeout_seconds modest.
# The tool-call cap is a backstop against loops, not a budget. All agents share it.
# History: at 80 (build 2) one looping agent used the whole budget and the next agent
# had time left but could not edit. At 400 (build 3) nothing stopped the loops: the
# localizer repeated one call up to 135 times until the time cap, and the prompts'
# no-repeat and get_status time rules were ignored (design doc section 11.5).
# At 150: tasks that were not looping used at most 76 calls in either probe, and a
# looping localizer (about 1.3 s per call) hits the cap in about 3 minutes instead of 6.
# WARNING: the cap is shared, so a loop that reaches it ends the task for every agent.
# The harness adds its "Only X tool calls remaining" warning at 140 calls.
# max_turns stays above the tool-call cap so that the tool-call cap is the one that binds.
evaluation:
  timeout_seconds: 120
  max_tool_calls: 150
  max_time_minutes: 6
  max_turns: 500
