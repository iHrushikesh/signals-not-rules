# Generation config for the coder (docs/agent_design.md section 11.2, lean config).
# Thinking budget 1024: the first submission showed thinking tokens alone exceed the
# 5-minute cap on 4x L4, so thinking is spent only where it pays (the coder).
# include_thoughts false: earlier thoughts are stripped from history.
# WARNING: keep prompt + max_output_tokens under 32,768; thinking tokens count
# toward max_output_tokens.
temperature: 0.2
top_p: 0.95
max_output_tokens: 4096
thinking_config:
  thinking_budget: 1024
  include_thoughts: false
