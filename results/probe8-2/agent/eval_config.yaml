# Per-task budgets for Stage 1 inference (HARNESS_README section 7.1).
# About 120 hidden tasks share a 12-hour total. Runs of 13 and 18 hours were
# still scored, so the working hypothesis is that the 12 hours count agent time
# only: 120 tasks at 6 minutes is exactly 12 hours (PLAN.md, time budget).
# WARNING: going above 6 bets that the limit is not enforced at all.
# WARNING: the time cap is checked between events, so one long LLM call or
# command can overrun it. Keep max_output_tokens and timeout_seconds modest.
# Tool calls and turns are set high on purpose so that time is the only limit that
# binds. On the Nov 11 probe a tool call took about 3 seconds, so 6 minutes holds
# roughly 120 calls. With the earlier cap of 80, one looping agent used the whole
# shared budget and the next agent had time left but could not edit.
# WARNING: with a cap this high the harness's "Only X tool calls remaining" warning
# never fires. The prompts tell agents to budget by time through get_status instead.
evaluation:
  timeout_seconds: 120
  max_tool_calls: 400
  max_time_minutes: 6
  max_turns: 500
